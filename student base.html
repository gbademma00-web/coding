<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
  </head>
  <body>
    <h1>Student list</h1>

    <button id="showBtn" class="show">Show Availble Students</button>
    <buttion id="clrBtn" class="clear">Clear</buttion>
    <div id="output" class="out"></div>

    <style>
        body {
            background-color: antiquewhite;
            color: blueviolet;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
        }
        .show {
            background-color: aquamarine;
            padding: 0.5rem;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid blue;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .show:hover {
            background-color: rgb(225, 225, 225);
            transform: translateY(-3px);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.8);
        }
        .clear {
            background-color: red;
            padding: 0.5rem;
            color: black;
            font-size: 1rem;
            border-radius: 8px;
            border: 2px solid black;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .clear:hover {
            background-color: rgb(219, 144, 144);
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.8);
            transform: translateX(-3px);
        }
        .out {
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.2rem;
        }
    </style>
    <script>
      const pupils = [
        { id: 1, name: "Mike", age: 16, score: 94 },
        { id: 2, name: "Tunde", age: 16, score: 85 },
        { id: 3, name: "Makinde", age: 18, score: 70 },
        { id: 4, name: "Akin", age: 17, score: 65},
        { id: 5, name: "Abdul", age: 16, score: 56 },
        { id: 6, name: "Matthew", age: 16, score: 43 },
      ];

      const output = document.getElementById("output");
      const showBtn = document.getElementById("showBtn");
      const clrBtn = document.getElementById("clrBtn");

      showBtn.addEventListener("click", function () {
        let html = "<ul>";

        for (let pupil of pupils) {
          if (pupil.score >= 90) {
            html += `<li><h1> ${pupil.name} - ${pupil.score} Distinction <h1></li>`;
          } else if (pupil.score >= 75) {
            html += `<li> ${pupil.name} - ${pupil.score} Great Results</li>`;
          } else if (pupil.score >= 60) {
            html += `<li> ${pupil.name} - ${pupil.score} Student needs improvement </li>`;
          }  else if (pupil.score >= 35) {
            html += `<li> ${pupil.name} - ${pupil.score} Student needs to repeat! </li>`;
          }
        }
        html += "</ul>";
        output.innerHTML = html;
      });
      clrBtn.addEventListener("click", function () {
        output.innerHTML = "";
      });
    </script>
  </body>
</html>
